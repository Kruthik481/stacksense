name: Deploy to Hugging Face Spaces

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    # Only ship commits that passed CI (or an explicit manual run).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check deploy configuration
        id: config
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::warning::Skipping deploy: set the HF_TOKEN secret and HF_SPACE variable (e.g. username/stacksense)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Add Space config to README
        if: steps.config.outputs.ready == 'true'
        run: cat .github/hf-space-header.md README.md > README.space.md && mv README.space.md README.md

      - name: Push snapshot to Space
        if: steps.config.outputs.ready == 'true'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git checkout --orphan space-deploy
          git add -A
          git commit -q -m "deploy: ${DEPLOY_SHA::7}"
          git push --force "https://${{ github.actor }}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" space-deploy:main
