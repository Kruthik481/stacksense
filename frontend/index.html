<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StackSense</title>
<style>
:root {
    --bg-primary: #09090b;
    --bg-secondary: #111113;
    --bg-surface: #18181b;
    --bg-hover: #27272a;
    --border: #27272a;
    --border-light: #3f3f46;
    --primary: #6366f1;
    --primary-hover: #818cf8;
    --primary-subtle: rgba(99,102,241,0.1);
    --text: #fafafa;
    --text-sec: #a1a1aa;
    --text-muted: #71717a;
    --code-bg: #0c0c10;
    --success: #22c55e;
    --warning: #f59e0b;
    --error: #ef4444;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
    --chart-1: #6366f1;
    --chart-2: #22c55e;
    --chart-3: #f59e0b;
    --chart-4: #ef4444;
    --chart-5: #06b6d4;
}
[data-theme="light"] {
    --bg-primary: #ffffff;
    --bg-secondary: #f4f4f5;
    --bg-surface: #e4e4e7;
    --bg-hover: #d4d4d8;
    --border: #d4d4d8;
    --border-light: #a1a1aa;
    --text: #09090b;
    --text-sec: #52525b;
    --text-muted: #71717a;
    --code-bg: #f0f0f3;
    --primary-subtle: rgba(99,102,241,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: var(--font);
    background: var(--bg-primary);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
}

/* ---- Sidebar ---- */
.sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: transform 0.25s ease, min-width 0.25s ease, width 0.25s ease;
}
.sidebar.closed { min-width: 0; width: 0; transform: translateX(-280px); }
.sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.brand svg { color: var(--primary); flex-shrink: 0; }
.brand span { font-weight: 700; font-size: 17px; letter-spacing: -0.3px; }
.new-chat-btn {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px dashed var(--border-light);
    background: transparent;
    color: var(--text-sec);
    font-size: 13.5px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font);
}
.new-chat-btn:hover { background: var(--bg-hover); color: var(--text); border-color: var(--text-muted); }

/* ---- Project Selector ---- */
.project-section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.project-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
.project-select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-surface);
    color: var(--text);
    font-size: 13px;
    font-family: var(--font);
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%2371717a' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    padding-right: 28px;
}
.project-select:focus { outline: none; border-color: var(--primary); }
.project-select option { background: var(--bg-surface); color: var(--text); }
.project-stats {
    display: flex;
    gap: 12px;
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-muted);
}
.project-stat { display: flex; align-items: center; gap: 4px; }

/* ---- Sidebar Nav ---- */
.sidebar-nav { padding: 8px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 4px; }
.nav-tab {
    flex: 1;
    padding: 8px 4px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    font-family: var(--font);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-weight: 500;
}
.nav-tab:hover { background: var(--bg-hover); color: var(--text-sec); }
.nav-tab.active { background: var(--primary-subtle); color: var(--primary-hover); }
.nav-tab svg { width: 14px; height: 14px; }

.sessions-list { flex: 1; overflow-y: auto; padding: 8px; }
.session-item {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 2px;
    transition: background 0.12s;
    gap: 8px;
}
.session-item:hover { background: var(--bg-hover); }
.session-item.active { background: var(--primary-subtle); }
.session-item .title {
    flex: 1;
    font-size: 13.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text-sec);
}
.session-item.active .title { color: var(--text); }
.session-item .del-btn {
    opacity: 0;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    font-size: 16px;
    line-height: 1;
    transition: all 0.12s;
}
.session-item:hover .del-btn { opacity: 1; }
.session-item .del-btn:hover { color: var(--error); background: rgba(239,68,68,0.1); }

/* ---- Main ---- */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
    height: 56px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
    gap: 12px;
    flex-shrink: 0;
}
.menu-btn, .theme-btn {
    background: none;
    border: none;
    color: var(--text-sec);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
}
.menu-btn:hover, .theme-btn:hover { background: var(--bg-hover); }
.theme-btn svg { width: 18px; height: 18px; }
.topbar-title { font-weight: 600; font-size: 15px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--success);
    flex-shrink: 0;
}
.status-dot.offline { background: var(--error); }
.status-label { font-size: 12px; color: var(--text-muted); }

/* ---- View Panels ---- */
.view-panel { flex: 1; overflow-y: auto; display: none; flex-direction: column; }
.view-panel.active { display: flex; }

/* ---- Chat ---- */
#chatView { padding: 0; }
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
}
.msg-row { display: flex; gap: 12px; max-width: 780px; width: 100%; margin: 0 auto; }
.msg-row.user { flex-direction: row-reverse; }
.avatar {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; margin-top: 2px;
}
.msg-row.bot .avatar { background: var(--primary-subtle); color: var(--primary); }
.msg-row.user .avatar { background: var(--bg-hover); color: var(--text-sec); }
.msg-bubble { flex: 1; min-width: 0; }
.msg-row.user .msg-bubble {
    background: var(--primary);
    padding: 12px 16px;
    border-radius: 16px 16px 4px 16px;
    font-size: 14.5px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    color: #fff;
}
.msg-row.bot .msg-bubble {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    padding: 14px 18px;
    border-radius: 16px 16px 16px 4px;
    font-size: 14.5px;
    line-height: 1.7;
}

/* ---- Sources ---- */
.sources { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.source-chip {
    font-size: 11.5px;
    padding: 3px 10px;
    border-radius: 5px;
    background: var(--primary-subtle);
    color: var(--primary-hover);
    border: 1px solid rgba(99,102,241,0.15);
    font-family: var(--mono);
}
.source-chip.graph {
    background: rgba(34,197,94,0.1);
    color: var(--success);
    border-color: rgba(34,197,94,0.15);
}

/* ---- Markdown in bot messages ---- */
.msg-row.bot .msg-bubble h1,
.msg-row.bot .msg-bubble h2,
.msg-row.bot .msg-bubble h3 { margin: 14px 0 6px; font-size: 15px; font-weight: 700; color: var(--text); }
.msg-row.bot .msg-bubble h1 { font-size: 17px; }
.msg-row.bot .msg-bubble h2 { font-size: 16px; }
.msg-row.bot .msg-bubble p { margin: 0 0 10px; }
.msg-row.bot .msg-bubble p:last-child { margin-bottom: 0; }
.msg-row.bot .msg-bubble ul,
.msg-row.bot .msg-bubble ol { margin: 0 0 10px 20px; }
.msg-row.bot .msg-bubble li { margin-bottom: 4px; }
.msg-row.bot .msg-bubble strong { color: var(--text); font-weight: 600; }
.msg-row.bot .msg-bubble a { color: var(--primary-hover); text-decoration: none; }
.msg-row.bot .msg-bubble code:not(pre code) {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 13px;
    color: #e879f9;
}

/* ---- Code blocks ---- */
.code-block {
    margin: 10px 0;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--code-bg);
}
.code-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 14px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid var(--border);
}
.code-lang { font-size: 11.5px; color: var(--text-muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.5px; }
.copy-btn {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-sec);
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.12s;
}
.copy-btn:hover { background: var(--bg-hover); color: var(--text); }
.copy-btn.copied { color: var(--success); border-color: var(--success); }
.code-block pre {
    margin: 0;
    padding: 14px;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    color: #d4d4d8;
}
.syn-kw { color: #c084fc; }
.syn-str { color: #4ade80; }
.syn-num { color: #fb923c; }
.syn-cmt { color: #525260; font-style: italic; }
.syn-fn  { color: #60a5fa; }
.syn-op  { color: #f472b6; }
.syn-cls { color: #facc15; }

/* ---- Loading dots ---- */
.loading-dots { display: flex; gap: 5px; padding: 8px 0; }
.loading-dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.4s infinite ease-in-out;
}
.loading-dots span:nth-child(1) { animation-delay: -0.32s; }
.loading-dots span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce {
    0%,80%,100% { transform: scale(0.4); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
}

/* ---- Empty state ---- */
.empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    opacity: 0.85;
}
.empty-icon { font-size: 40px; margin-bottom: 4px; }
.empty-state h2 { font-size: 22px; font-weight: 700; }
.empty-state p { color: var(--text-sec); font-size: 14.5px; }
.suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; max-width: 520px; justify-content: center; }
.suggest-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-surface);
    color: var(--text-sec);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font);
}
.suggest-btn:hover { background: var(--bg-hover); color: var(--text); border-color: var(--border-light); }

/* ---- Input area ---- */
.input-area {
    padding: 12px 16px 16px;
    background: var(--bg-primary);
    border-top: 1px solid var(--border);
}
.input-container {
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px 12px;
    transition: border-color 0.15s;
}
.input-container:focus-within { border-color: var(--primary); }
.input-container textarea {
    flex: 1;
    background: none;
    border: none;
    color: var(--text);
    font-size: 14.5px;
    font-family: var(--font);
    resize: none;
    outline: none;
    line-height: 1.5;
    max-height: 160px;
    padding: 4px 0;
}
.input-container textarea::placeholder { color: var(--text-muted); }
.send-btn {
    width: 36px; height: 36px;
    border-radius: 10px;
    border: none;
    background: var(--primary);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.12s, opacity 0.12s;
}
.send-btn:hover { background: var(--primary-hover); }
.send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.input-hint {
    max-width: 780px;
    margin: 6px auto 0;
    text-align: center;
    font-size: 11.5px;
    color: var(--text-muted);
}

/* ---- Dashboard ---- */
.dashboard { padding: 24px; overflow-y: auto; flex: 1; }
.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
    max-width: 1200px;
    margin: 0 auto;
}
.dash-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
}
.dash-card h3 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    margin-bottom: 16px;
    font-weight: 600;
}
.stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
}
.stat-row:last-child { border-bottom: none; }
.stat-label { font-size: 13px; color: var(--text-sec); }
.stat-value { font-size: 14px; font-weight: 600; font-family: var(--mono); color: var(--text); }
.stat-big {
    font-size: 32px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
    margin-bottom: 4px;
}
.stat-sub { font-size: 12px; color: var(--text-muted); }
.stat-highlight { color: var(--primary); }
.stat-success { color: var(--success); }
.stat-warning { color: var(--warning); }

.bar-chart { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.bar-row { display: flex; align-items: center; gap: 10px; }
.bar-label { font-size: 12px; color: var(--text-sec); width: 90px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-track { flex: 1; height: 20px; background: var(--bg-hover); border-radius: 4px; overflow: hidden; position: relative; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; min-width: 2px; }
.bar-val { font-size: 11px; font-family: var(--mono); color: var(--text-muted); width: 40px; text-align: right; flex-shrink: 0; }

.ring-chart { display: flex; align-items: center; gap: 20px; margin-top: 8px; }
.ring-svg { width: 80px; height: 80px; transform: rotate(-90deg); }
.ring-svg circle { fill: none; stroke-width: 8; }
.ring-svg .ring-bg { stroke: var(--bg-hover); }
.ring-svg .ring-fg { stroke: var(--primary); stroke-linecap: round; transition: stroke-dashoffset 0.6s ease; }
.ring-label { display: flex; flex-direction: column; }

.dep-graph-viz { margin-top: 8px; overflow-x: auto; }
.dep-node {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 6px;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    font-size: 12px;
    font-family: var(--mono);
    color: var(--text-sec);
    margin: 3px;
    cursor: default;
    transition: all 0.15s;
}
.dep-node:hover { border-color: var(--primary); color: var(--text); }
.dep-node .dep-count {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 10px;
    background: var(--primary-subtle);
    color: var(--primary-hover);
    font-weight: 600;
}
.dash-card.full-width { grid-column: 1 / -1; }
.dash-refresh {
    display: flex;
    justify-content: flex-end;
    max-width: 1200px;
    margin: 0 auto 16px;
}
.refresh-btn {
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-surface);
    color: var(--text-sec);
    font-size: 12px;
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
}
.refresh-btn:hover { background: var(--bg-hover); color: var(--text); }
.refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ---- File Browser ---- */
.file-browser { display: flex; flex: 1; overflow: hidden; }
.file-tree {
    width: 300px;
    min-width: 200px;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 8px;
    background: var(--bg-secondary);
}
.file-preview {
    flex: 1;
    overflow: auto;
    background: var(--bg-primary);
}
.file-preview-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
}
.file-preview-header .file-icon { font-size: 14px; }
.file-preview-header .file-name {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    flex: 1;
}
.file-preview-header .file-meta {
    font-size: 11px;
    color: var(--text-muted);
}
.file-preview-content {
    padding: 0;
    overflow: auto;
    flex: 1;
}
.file-preview-content pre {
    margin: 0;
    padding: 16px;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-sec);
    white-space: pre;
    counter-reset: line;
}
.file-preview-content .line-num {
    display: inline-block;
    width: 40px;
    text-align: right;
    padding-right: 16px;
    color: var(--text-muted);
    user-select: none;
    opacity: 0.5;
}
.file-preview-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-muted);
    font-size: 14px;
    gap: 8px;
}
.tree-folder {
    cursor: pointer;
    user-select: none;
}
.tree-folder-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--text-sec);
    transition: background 0.12s;
}
.tree-folder-header:hover { background: var(--bg-hover); }
.tree-folder-header .arrow {
    font-size: 10px;
    transition: transform 0.15s;
    width: 12px;
    text-align: center;
    color: var(--text-muted);
}
.tree-folder.open > .tree-folder-header .arrow { transform: rotate(90deg); }
.tree-folder-children {
    display: none;
    padding-left: 16px;
}
.tree-folder.open > .tree-folder-children { display: block; }
.tree-file {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px 5px 28px;
    border-radius: 6px;
    font-size: 13px;
    font-family: var(--mono);
    color: var(--text-sec);
    cursor: pointer;
    transition: background 0.12s;
}
.tree-file:hover { background: var(--bg-hover); color: var(--text); }
.tree-file.active { background: var(--primary-subtle); color: var(--primary-hover); }
.tree-file .chunk-badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    background: var(--bg-hover);
    color: var(--text-muted);
    margin-left: auto;
}

/* ---- Ingest Progress ---- */
.ingest-overlay {
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
}
.ingest-modal {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    width: 420px;
    max-width: 90vw;
}
.ingest-modal h3 { font-size: 16px; margin-bottom: 20px; }
.progress-bar {
    height: 8px;
    background: var(--bg-hover);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 12px;
}
.progress-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 4px;
    transition: width 0.3s ease;
    width: 0;
}
.progress-stage {
    font-size: 13px;
    color: var(--text-sec);
    margin-bottom: 4px;
}
.progress-detail {
    font-size: 12px;
    color: var(--text-muted);
}

/* ---- Mobile ---- */
@media (max-width: 768px) {
    .sidebar {
        position: fixed; z-index: 200; height: 100vh;
        transform: translateX(-100%);
        box-shadow: 4px 0 24px rgba(0,0,0,0.5);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar.closed { transform: translateX(-100%); }
    .overlay { display: none; position: fixed; inset: 0; z-index: 199; background: rgba(0,0,0,0.5); }
    .overlay.show { display: block; }
    .msg-row { max-width: 100%; }
    .input-container { max-width: 100%; }
    .input-hint { max-width: 100%; }
    .suggestions { max-width: 100%; }
    .file-tree { width: 100%; min-width: 100%; border-right: none; }
    .file-preview { display: none; }
    .file-browser.show-preview .file-tree { display: none; }
    .file-browser.show-preview .file-preview { display: flex; flex-direction: column; }
    .dashboard-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            <span>StackSense</span>
        </div>
        <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
    </div>
    <div class="project-section">
        <div class="project-label">Project</div>
        <select class="project-select" id="projectSelect" onchange="switchProject(this.value)">
            <option value="">Default (all indexed)</option>
        </select>
        <div class="project-stats" id="projectStats"></div>
    </div>
    <div class="sidebar-nav">
        <button class="nav-tab active" data-view="chat" onclick="switchView('chat')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
            Chat
        </button>
        <button class="nav-tab" data-view="dashboard" onclick="switchView('dashboard')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
            Dashboard
        </button>
        <button class="nav-tab" data-view="files" onclick="switchView('files')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
            Files
        </button>
    </div>
    <div class="sessions-list" id="sessionsList"></div>
</aside>

<div class="main">
    <header class="topbar">
        <button class="menu-btn" onclick="toggleSidebar()">&#9776;</button>
        <span class="topbar-title" id="topbarTitle">StackSense</span>
        <div style="display:flex;align-items:center;gap:8px;">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-label" id="statusLabel">Checking...</span>
        </div>
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">
            <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
            </svg>
        </button>
    </header>

    <!-- Chat View -->
    <div class="view-panel active" id="chatView">
        <div class="chat" id="chat">
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">&#9889;</div>
                <h2>StackSense</h2>
                <p>Ask anything about your indexed codebase</p>
                <div class="suggestions">
                    <button class="suggest-btn" onclick="askSuggestion(this)">How does authentication work?</button>
                    <button class="suggest-btn" onclick="askSuggestion(this)">Explain the main API endpoints</button>
                    <button class="suggest-btn" onclick="askSuggestion(this)">What files handle data processing?</button>
                    <button class="suggest-btn" onclick="askSuggestion(this)">Show me the error handling patterns</button>
                </div>
            </div>
        </div>
        <div class="input-area">
            <div class="input-container">
                <textarea id="input" rows="1" placeholder="Ask about your code..." disabled></textarea>
                <button class="send-btn" id="sendBtn" onclick="send()" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                </button>
            </div>
            <div class="input-hint">Enter to send &middot; Shift+Enter for new line</div>
        </div>
    </div>

    <!-- Dashboard View -->
    <div class="view-panel" id="dashboardView">
        <div class="dashboard" id="dashboardContent"></div>
    </div>

    <!-- Files View -->
    <div class="view-panel" id="filesView">
        <div class="file-browser" id="fileBrowser">
            <div class="file-tree" id="fileTree">
                <div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">Loading files...</div>
            </div>
            <div class="file-preview" id="filePreview">
                <div class="file-preview-empty">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:0.4"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    <span>Select a file to preview</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const API = '/api';
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const emptyState = document.getElementById('emptyState');
const sessionsList = document.getElementById('sessionsList');
const topbarTitle = document.getElementById('topbarTitle');
const statusDot = document.getElementById('statusDot');
const statusLabel = document.getElementById('statusLabel');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const projectSelect = document.getElementById('projectSelect');
const projectStats = document.getElementById('projectStats');

let currentSessionId = null;
let currentProjectId = null;
let sessions = [];
let projects = [];
let isStreaming = false;
let isMobile = window.innerWidth <= 768;
let currentView = 'chat';
let dashboardData = null;
let filesData = null;

// =================== Theme ===================

function initTheme() {
    const saved = localStorage.getItem('stacksense-theme');
    if (saved === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
    }
    updateThemeIcon();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    if (current === 'light') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('stacksense-theme', 'dark');
    } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('stacksense-theme', 'light');
    }
    updateThemeIcon();
}

function updateThemeIcon() {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    document.getElementById('themeIcon').innerHTML = isLight
        ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
        : '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
}

initTheme();

// =================== View Switching ===================

function switchView(view) {
    currentView = view;
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
    document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
    document.getElementById(view + 'View').classList.add('active');

    if (view === 'dashboard') loadDashboard();
    if (view === 'files') loadFiles();
    if (view === 'chat') {
        const s = sessions.find(s => s.id === currentSessionId);
        topbarTitle.textContent = s ? s.title : 'StackSense';
    } else if (view === 'dashboard') {
        topbarTitle.textContent = 'Analytics Dashboard';
    } else if (view === 'files') {
        topbarTitle.textContent = 'File Browser';
    }
}

// =================== Init ===================

async function init() {
    await checkHealth();
    await loadProjects();
    await loadSessions();
    if (sessions.length === 0) {
        await newChat();
    } else {
        await switchSession(sessions[0].id);
    }
    inputEl.disabled = false;
    sendBtn.disabled = false;
    inputEl.focus();
}

async function checkHealth() {
    try {
        const r = await fetch(`${API}/health`);
        const d = await r.json();
        statusDot.className = 'status-dot' + (d.index_loaded ? '' : ' offline');
        const label = d.hybrid_search ? `${d.vectors} vectors (hybrid)` : d.index_loaded ? `${d.vectors} vectors` : 'No index';
        statusLabel.textContent = label;
    } catch {
        statusDot.className = 'status-dot offline';
        statusLabel.textContent = 'Offline';
    }
}

// =================== Projects ===================

async function loadProjects() {
    try {
        const r = await fetch(`${API}/projects`);
        projects = await r.json();
        renderProjects();
    } catch { projects = []; }
}

function renderProjects() {
    projectSelect.innerHTML = '<option value="">Default (all indexed)</option>';
    projects.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.name;
        if (p.id === currentProjectId) opt.selected = true;
        projectSelect.appendChild(opt);
    });
    updateProjectStats();
}

function updateProjectStats() {
    if (!currentProjectId) {
        projectStats.innerHTML = '';
        return;
    }
    const p = projects.find(pr => pr.id === currentProjectId);
    if (p) {
        projectStats.innerHTML = `
            <span class="project-stat">${p.files_count} files</span>
            <span class="project-stat">${p.chunks_count} chunks</span>
        `;
    }
}

async function switchProject(projectId) {
    if (projectId === currentProjectId) return;
    currentProjectId = projectId || null;
    if (currentProjectId) {
        try {
            await fetch(`${API}/projects/${currentProjectId}/switch`, { method: 'POST' });
        } catch(e) { console.error('switchProject:', e); }
    }
    updateProjectStats();
    await checkHealth();
}

// =================== Sessions ===================

async function loadSessions() {
    try {
        const r = await fetch(`${API}/sessions`);
        sessions = await r.json();
        renderSessions();
    } catch { sessions = []; }
}

function renderSessions() {
    sessionsList.innerHTML = '';
    sessions.forEach(s => {
        const div = document.createElement('div');
        div.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
        div.innerHTML = `
            <span class="title">${escapeHtml(s.title)}</span>
            <button class="del-btn" onclick="event.stopPropagation(); deleteSession('${s.id}')" title="Delete">&times;</button>
        `;
        div.onclick = () => { switchView('chat'); switchSession(s.id); };
        sessionsList.appendChild(div);
    });
}

async function newChat() {
    try {
        const body = { title: 'New Chat' };
        if (currentProjectId) body.project_id = currentProjectId;
        const r = await fetch(`${API}/sessions`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
        const s = await r.json();
        sessions.unshift(s);
        switchView('chat');
        await switchSession(s.id);
        renderSessions();
        if (isMobile) closeSidebar();
    } catch(e) { console.error('newChat:', e); }
}

async function switchSession(id) {
    currentSessionId = id;
    const session = sessions.find(s => s.id === id);
    if (currentView === 'chat') topbarTitle.textContent = session ? session.title : 'StackSense';
    renderSessions();
    await loadMessages(id);
}

async function loadMessages(sessionId) {
    clearChat();
    try {
        const r = await fetch(`${API}/sessions/${sessionId}/messages`);
        const msgs = await r.json();
        if (msgs.length === 0) {
            emptyState.style.display = 'flex';
            return;
        }
        emptyState.style.display = 'none';
        msgs.forEach(m => {
            if (m.role === 'user') addUserMsg(m.content);
            else addBotMsg(m.content);
        });
        scrollBottom();
    } catch(e) { console.error('loadMessages:', e); }
}

async function deleteSession(id) {
    try {
        await fetch(`${API}/sessions/${id}`, { method: 'DELETE' });
        sessions = sessions.filter(s => s.id !== id);
        if (id === currentSessionId) {
            if (sessions.length > 0) await switchSession(sessions[0].id);
            else await newChat();
        }
        renderSessions();
    } catch(e) { console.error('deleteSession:', e); }
}

// =================== Chat ===================

function clearChat() {
    const children = Array.from(chatEl.children);
    children.forEach(c => { if (c !== emptyState) chatEl.removeChild(c); });
    emptyState.style.display = 'flex';
}

function addUserMsg(text) {
    emptyState.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `<div class="avatar">U</div><div class="msg-bubble">${escapeHtml(text)}</div>`;
    chatEl.appendChild(row);
}

function addBotMsg(md) {
    emptyState.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `
        <div class="avatar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></div>
        <div class="msg-bubble">${parseMarkdown(md)}</div>`;
    chatEl.appendChild(row);
}

function createStreamingMsg() {
    emptyState.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `
        <div class="avatar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></div>
        <div class="msg-bubble">
            <div class="sources-container"></div>
            <div class="content-container"><div class="loading-dots"><span></span><span></span><span></span></div></div>
        </div>`;
    chatEl.appendChild(row);
    return {
        sources: row.querySelector('.sources-container'),
        content: row.querySelector('.content-container'),
    };
}

function scrollBottom() {
    chatEl.scrollTop = chatEl.scrollHeight;
}

// =================== Send ===================

async function send() {
    const text = inputEl.value.trim();
    if (!text || isStreaming) return;

    addUserMsg(text);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    scrollBottom();

    isStreaming = true;
    sendBtn.disabled = true;
    inputEl.disabled = true;

    const stream = createStreamingMsg();
    let fullText = '';
    let pendingRender = false;

    try {
        const res = await fetch(`${API}/stream`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ query: text, session_id: currentSessionId, project_id: currentProjectId }),
        });

        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            stream.content.innerHTML = `<p style="color:var(--error)">Error: ${escapeHtml(err.detail || res.statusText)}</p>`;
            finishStream();
            return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();

            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const raw = line.slice(6).trim();
                if (!raw) continue;

                let data;
                try { data = JSON.parse(raw); } catch { continue; }

                if (data.type === 'sources' && data.sources?.length) {
                    stream.sources.innerHTML = '<div class="sources">' +
                        data.sources.map(s => `<span class="source-chip${s.via ? ' graph' : ''}">${escapeHtml(s.file)} :${s.lines}${s.via ? ' (graph)' : ''}</span>`).join('') +
                        '</div>';
                } else if (data.type === 'token') {
                    fullText += data.token;
                    if (!pendingRender) {
                        pendingRender = true;
                        requestAnimationFrame(() => {
                            stream.content.innerHTML = parseMarkdown(fullText);
                            scrollBottom();
                            pendingRender = false;
                        });
                    }
                } else if (data.type === 'done') {
                    break;
                }
            }
        }

        stream.content.innerHTML = parseMarkdown(fullText);
        scrollBottom();
    } catch (err) {
        stream.content.innerHTML = `<p style="color:var(--error)">Connection error &#8212; is the server running?</p>`;
    }

    finishStream();
    refreshCurrentSession();
}

function finishStream() {
    isStreaming = false;
    sendBtn.disabled = false;
    inputEl.disabled = false;
    inputEl.focus();
}

async function refreshCurrentSession() {
    await loadSessions();
    const s = sessions.find(s => s.id === currentSessionId);
    if (s && currentView === 'chat') topbarTitle.textContent = s.title;
}

function askSuggestion(btn) {
    inputEl.value = btn.textContent;
    send();
}

// =================== Dashboard ===================

async function loadDashboard() {
    const container = document.getElementById('dashboardContent');
    container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:200px;color:var(--text-muted)">Loading dashboard...</div>';

    const [healthRes, cacheRes, graphRes] = await Promise.allSettled([
        fetch(`${API}/health`).then(r => r.json()),
        fetch(`${API}/cache/stats`).then(r => r.json()),
        fetch(`${API}/graph`).then(r => r.json()),
    ]);

    const health = healthRes.status === 'fulfilled' ? healthRes.value : {};
    const cache = cacheRes.status === 'fulfilled' ? cacheRes.value : {};
    const graph = graphRes.status === 'fulfilled' ? graphRes.value : { nodes: [], total_files: 0, total_edges: 0 };

    dashboardData = { health, cache, graph };
    renderDashboard();
}

function renderDashboard() {
    if (!dashboardData) return;
    const { health, cache, graph } = dashboardData;
    const ec = cache.embedding_cache || {};
    const qc = cache.query_cache || {};

    const container = document.getElementById('dashboardContent');
    container.innerHTML = `
        <div class="dash-refresh">
            <button class="refresh-btn" id="dashRefreshBtn" onclick="refreshDashboard()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                Refresh
            </button>
        </div>
        <div class="dashboard-grid">
            <!-- Index Stats -->
            <div class="dash-card">
                <h3>Index Status</h3>
                <div style="margin-bottom:12px">
                    <div class="stat-big ${health.index_loaded ? 'stat-highlight' : ''}">${health.vectors || 0}</div>
                    <div class="stat-sub">vectors indexed</div>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Status</span>
                    <span class="stat-value" style="color:${health.index_loaded ? 'var(--success)' : 'var(--error)'}">${health.index_loaded ? 'Loaded' : 'Not loaded'}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Hybrid Search</span>
                    <span class="stat-value">${health.hybrid_search ? 'Active' : 'Off'}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">LLM Model</span>
                    <span class="stat-value">${escapeHtml(health.model || 'N/A')}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Embedding Model</span>
                    <span class="stat-value" style="font-size:11px">${escapeHtml(health.embedding_model || 'N/A')}</span>
                </div>
            </div>

            <!-- Embedding Cache -->
            <div class="dash-card">
                <h3>Embedding Cache</h3>
                <div class="ring-chart">
                    ${renderRing(ec.hit_rate || 0)}
                    <div class="ring-label">
                        <div class="stat-big stat-success">${((ec.hit_rate || 0) * 100).toFixed(1)}%</div>
                        <div class="stat-sub">hit rate</div>
                    </div>
                </div>
                <div class="stat-row" style="margin-top:12px">
                    <span class="stat-label">Cached</span>
                    <span class="stat-value">${ec.size || 0} / ${ec.maxsize || 0}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Hits / Misses</span>
                    <span class="stat-value">${ec.hits || 0} / ${ec.misses || 0}</span>
                </div>
            </div>

            <!-- Query Cache -->
            <div class="dash-card">
                <h3>Query Cache</h3>
                <div class="ring-chart">
                    ${renderRing(qc.hit_rate || 0)}
                    <div class="ring-label">
                        <div class="stat-big stat-warning">${((qc.hit_rate || 0) * 100).toFixed(1)}%</div>
                        <div class="stat-sub">hit rate</div>
                    </div>
                </div>
                <div class="stat-row" style="margin-top:12px">
                    <span class="stat-label">Cached</span>
                    <span class="stat-value">${qc.size || 0} / ${qc.maxsize || 0}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">TTL</span>
                    <span class="stat-value">${qc.ttl_seconds || 0}s</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Hits / Misses</span>
                    <span class="stat-value">${qc.hits || 0} / ${qc.misses || 0}</span>
                </div>
            </div>

            <!-- Dependency Graph -->
            <div class="dash-card">
                <h3>Dependency Graph</h3>
                <div style="margin-bottom:12px">
                    <div class="stat-big">${graph.total_files || 0}</div>
                    <div class="stat-sub">files tracked &middot; ${graph.total_edges || 0} edges</div>
                </div>
                ${renderDepStats(graph)}
            </div>

            <!-- Top Connected Files -->
            <div class="dash-card full-width">
                <h3>Most Connected Files</h3>
                <div class="bar-chart">
                    ${renderTopFiles(graph)}
                </div>
            </div>
        </div>
    `;
}

function renderRing(rate) {
    const r = 32;
    const c = 2 * Math.PI * r;
    const offset = c - (rate * c);
    return `<svg class="ring-svg" viewBox="0 0 80 80">
        <circle class="ring-bg" cx="40" cy="40" r="${r}"/>
        <circle class="ring-fg" cx="40" cy="40" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
    </svg>`;
}

function renderDepStats(graph) {
    if (!graph.nodes || graph.nodes.length === 0) {
        return '<div style="color:var(--text-muted);font-size:13px">No dependency data. Ingest a project first.</div>';
    }
    const withDeps = graph.nodes.filter(n => n.dependencies.length > 0).length;
    const withDependents = graph.nodes.filter(n => n.dependents.length > 0).length;
    const isolated = graph.nodes.filter(n => n.dependencies.length === 0 && n.dependents.length === 0).length;
    return `
        <div class="stat-row">
            <span class="stat-label">Files with imports</span>
            <span class="stat-value">${withDeps}</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Files imported by others</span>
            <span class="stat-value">${withDependents}</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Isolated files</span>
            <span class="stat-value">${isolated}</span>
        </div>
    `;
}

function renderTopFiles(graph) {
    if (!graph.nodes || graph.nodes.length === 0) {
        return '<div style="color:var(--text-muted);font-size:13px;padding:8px 0">No files indexed yet.</div>';
    }
    const sorted = [...graph.nodes]
        .map(n => ({ name: n.name, connections: n.dependencies.length + n.dependents.length }))
        .filter(n => n.connections > 0)
        .sort((a, b) => b.connections - a.connections)
        .slice(0, 10);

    if (sorted.length === 0) {
        return '<div style="color:var(--text-muted);font-size:13px;padding:8px 0">No inter-file dependencies found.</div>';
    }

    const max = sorted[0].connections;
    const colors = ['var(--chart-1)', 'var(--chart-2)', 'var(--chart-3)', 'var(--chart-4)', 'var(--chart-5)'];
    return sorted.map((f, i) => `
        <div class="bar-row">
            <span class="bar-label" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</span>
            <div class="bar-track">
                <div class="bar-fill" style="width:${(f.connections/max*100).toFixed(1)}%;background:${colors[i % colors.length]}"></div>
            </div>
            <span class="bar-val">${f.connections}</span>
        </div>
    `).join('');
}

async function refreshDashboard() {
    const btn = document.getElementById('dashRefreshBtn');
    btn.classList.add('spinning');
    await loadDashboard();
    btn.classList.remove('spinning');
}

// =================== File Browser ===================

async function loadFiles() {
    const tree = document.getElementById('fileTree');
    try {
        const r = await fetch(`${API}/files`);
        if (!r.ok) {
            tree.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">No index loaded. Ingest a project first.</div>';
            return;
        }
        filesData = await r.json();
        renderFileTree();
    } catch {
        tree.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">Failed to load files.</div>';
    }
}

function renderFileTree() {
    const tree = document.getElementById('fileTree');
    if (!filesData || filesData.length === 0) {
        tree.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">No files indexed.</div>';
        return;
    }

    const root = {};
    filesData.forEach(f => {
        const parts = f.path.split('/').filter(Boolean);
        let node = root;
        for (let i = 0; i < parts.length - 1; i++) {
            if (!node[parts[i]]) node[parts[i]] = {};
            node = node[parts[i]];
        }
        node[parts[parts.length - 1]] = f;
    });

    tree.innerHTML = '';
    renderTreeNode(root, tree, 0);
}

function renderTreeNode(node, container, depth) {
    const entries = Object.entries(node).sort(([a, va], [b, vb]) => {
        const aIsFile = va && va.path;
        const bIsFile = vb && vb.path;
        if (aIsFile && !bIsFile) return 1;
        if (!aIsFile && bIsFile) return -1;
        return a.localeCompare(b);
    });

    entries.forEach(([name, value]) => {
        if (value && value.path) {
            const file = document.createElement('div');
            file.className = 'tree-file';
            file.dataset.path = value.path;
            file.innerHTML = `
                <span>${fileIcon(name)}</span>
                <span style="flex:1;overflow:hidden;text-overflow:ellipsis">${escapeHtml(name)}</span>
                <span class="chunk-badge">${value.chunks}</span>
            `;
            file.onclick = () => selectFile(value.path, file);
            container.appendChild(file);
        } else {
            const folder = document.createElement('div');
            folder.className = 'tree-folder';
            folder.innerHTML = `
                <div class="tree-folder-header">
                    <span class="arrow">&#9654;</span>
                    <span>&#128193;</span>
                    <span>${escapeHtml(name)}</span>
                </div>
                <div class="tree-folder-children"></div>
            `;
            folder.querySelector('.tree-folder-header').onclick = () => folder.classList.toggle('open');
            container.appendChild(folder);
            renderTreeNode(value, folder.querySelector('.tree-folder-children'), depth + 1);
        }
    });
}

function fileIcon(name) {
    const ext = name.split('.').pop().toLowerCase();
    const icons = {
        py: '&#128013;', js: '&#9889;', ts: '&#128311;', jsx: '&#9881;', tsx: '&#9881;',
        go: '&#128039;', rs: '&#9881;', java: '&#9749;', rb: '&#128142;',
        html: '&#127760;', css: '&#127912;', json: '&#128196;', md: '&#128196;',
        yml: '&#9881;', yaml: '&#9881;', toml: '&#9881;', sql: '&#128451;',
    };
    return icons[ext] || '&#128196;';
}

async function selectFile(path, el) {
    document.querySelectorAll('.tree-file.active').forEach(f => f.classList.remove('active'));
    el.classList.add('active');

    const preview = document.getElementById('filePreview');
    preview.innerHTML = '<div class="file-preview-empty">Loading...</div>';

    if (isMobile) {
        document.getElementById('fileBrowser').classList.add('show-preview');
    }

    try {
        const r = await fetch(`${API}/files/${path}/source`);
        if (!r.ok) {
            preview.innerHTML = '<div class="file-preview-empty">Could not load file.</div>';
            return;
        }
        const data = await r.json();
        const lines = data.content.split('\n');
        const numbered = lines.map((line, i) =>
            `<span class="line-num">${i + 1}</span>${escapeHtml(line)}`
        ).join('\n');

        preview.innerHTML = `
            <div class="file-preview-header">
                <span class="file-icon">${fileIcon(data.name)}</span>
                <span class="file-name">${escapeHtml(data.name)}</span>
                <span class="file-meta">${data.lines} lines</span>
                ${isMobile ? '<button class="menu-btn" onclick="document.getElementById(\'fileBrowser\').classList.remove(\'show-preview\')" style="font-size:16px">&larr;</button>' : ''}
            </div>
            <div class="file-preview-content">
                <pre>${numbered}</pre>
            </div>
        `;
    } catch {
        preview.innerHTML = '<div class="file-preview-empty">Failed to load file.</div>';
    }
}

// =================== Markdown Parser ===================

function parseMarkdown(md) {
    if (!md) return '';
    let html = '';
    const lines = md.split('\n');
    let inCode = false, codeBuf = '', codeLang = '';
    let inUL = false, inOL = false;

    for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        if (line.startsWith('```')) {
            if (inCode) {
                html += renderCodeBlock(codeBuf, codeLang);
                inCode = false; codeBuf = ''; codeLang = '';
            } else {
                if (inUL) { html += '</ul>'; inUL = false; }
                if (inOL) { html += '</ol>'; inOL = false; }
                inCode = true;
                codeLang = line.slice(3).trim();
            }
            continue;
        }
        if (inCode) { codeBuf += (codeBuf ? '\n' : '') + line; continue; }

        if (line.startsWith('### '))  { closeList(); html += `<h3>${inline(line.slice(4))}</h3>`; continue; }
        if (line.startsWith('## '))   { closeList(); html += `<h2>${inline(line.slice(3))}</h2>`; continue; }
        if (line.startsWith('# '))    { closeList(); html += `<h1>${inline(line.slice(2))}</h1>`; continue; }

        const ulMatch = line.match(/^[\-\*]\s+(.*)/);
        if (ulMatch) {
            if (inOL) { html += '</ol>'; inOL = false; }
            if (!inUL) { html += '<ul>'; inUL = true; }
            html += `<li>${inline(ulMatch[1])}</li>`;
            continue;
        }
        const olMatch = line.match(/^\d+\.\s+(.*)/);
        if (olMatch) {
            if (inUL) { html += '</ul>'; inUL = false; }
            if (!inOL) { html += '<ol>'; inOL = true; }
            html += `<li>${inline(olMatch[1])}</li>`;
            continue;
        }

        if (line.trim() === '') { closeList(); continue; }

        closeList();
        html += `<p>${inline(line)}</p>`;
    }

    if (inCode) html += renderCodeBlock(codeBuf, codeLang);
    closeList();

    return html;

    function closeList() {
        if (inUL) { html += '</ul>'; inUL = false; }
        if (inOL) { html += '</ol>'; inOL = false; }
    }
}

function inline(text) {
    text = escapeHtml(text);
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return text;
}

// =================== Code Blocks ===================

function renderCodeBlock(code, lang) {
    const id = 'cb_' + Math.random().toString(36).slice(2, 8);
    const highlighted = highlightSyntax(escapeHtml(code), lang);
    return `<div class="code-block">
        <div class="code-header">
            <span class="code-lang">${escapeHtml(lang || 'code')}</span>
            <button class="copy-btn" onclick="copyCode('${id}', this)">Copy</button>
        </div>
        <pre id="${id}"><code>${highlighted}</code></pre>
    </div>`;
}

function highlightSyntax(code, lang) {
    const l = (lang || '').toLowerCase();
    if (['python', 'py'].includes(l)) return highlightPython(code);
    if (['javascript', 'js', 'typescript', 'ts', 'jsx', 'tsx'].includes(l)) return highlightJS(code);
    return highlightGeneric(code);
}

function highlightPython(code) {
    const kw = /\b(def|class|return|if|elif|else|for|while|import|from|as|try|except|finally|raise|with|yield|lambda|pass|break|continue|and|or|not|in|is|None|True|False|self|async|await)\b/g;
    code = code.replace(/(#.*)$/gm, '<span class="syn-cmt">$1</span>');
    code = code.replace(/("""[\s\S]*?"""|'''[\s\S]*?''')/g, '<span class="syn-str">$1</span>');
    code = code.replace(/((?<![\\])(?:"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'))/g, '<span class="syn-str">$1</span>');
    code = code.replace(kw, '<span class="syn-kw">$1</span>');
    code = code.replace(/\b(\d+\.?\d*)\b/g, '<span class="syn-num">$1</span>');
    code = code.replace(/\b([a-zA-Z_]\w*)\s*(?=\()/g, '<span class="syn-fn">$1</span>');
    return code;
}

function highlightJS(code) {
    const kw = /\b(const|let|var|function|return|if|else|for|while|class|import|export|from|async|await|try|catch|finally|throw|new|this|typeof|instanceof|default|switch|case|break|continue|null|undefined|true|false)\b/g;
    code = code.replace(/(\/\/.*$)/gm, '<span class="syn-cmt">$1</span>');
    code = code.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="syn-cmt">$1</span>');
    code = code.replace(/((?<![\\])(?:`(?:[^`\\]|\\.)*`|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'))/g, '<span class="syn-str">$1</span>');
    code = code.replace(kw, '<span class="syn-kw">$1</span>');
    code = code.replace(/\b(\d+\.?\d*)\b/g, '<span class="syn-num">$1</span>');
    code = code.replace(/\b([a-zA-Z_$]\w*)\s*(?=\()/g, '<span class="syn-fn">$1</span>');
    return code;
}

function highlightGeneric(code) {
    code = code.replace(/(#.*$|\/\/.*$)/gm, '<span class="syn-cmt">$1</span>');
    code = code.replace(/((?:"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'))/g, '<span class="syn-str">$1</span>');
    code = code.replace(/\b(\d+\.?\d*)\b/g, '<span class="syn-num">$1</span>');
    return code;
}

function copyCode(id, btn) {
    const pre = document.getElementById(id);
    if (!pre) return;
    const text = pre.textContent;
    navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
    });
}

// =================== Helpers ===================

function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function toggleSidebar() {
    if (isMobile) {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
    } else {
        sidebar.classList.toggle('closed');
    }
}

function closeSidebar() {
    if (isMobile) {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
    }
}

// =================== Events ===================

inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
});

inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
    }
});

window.addEventListener('resize', () => {
    isMobile = window.innerWidth <= 768;
});

// =================== Start ===================
init();
